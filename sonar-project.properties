sonar.organization=resolum
sonar.projectKey=resolum_alivia-web-services

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

# Jacoco Coverage Report Path
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusions for Code Coverage (glue, config, pure DTOs)
sonar.coverage.exclusions=\
  **/configuration/**,\
  **/*Configuration.java,\
  **/*Config.java,\
  **/interfaces/rest/resources/**,\
  **/shared/infrastructure/persistence/jpa/entities/**,\
  **/shared/infrastructure/documentation/**

# Exclusions for Duplication (CPD)
sonar.cpd.exclusions=\
  **/interfaces/rest/resources/**,\
  **/domain/model/commands/**,\
  **/shared/infrastructure/persistence/jpa/entities/**