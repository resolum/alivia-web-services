<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te damos la bienvenida a Alivia</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f1ec;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f1ec;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:32px 32px 8px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#1f5f8b;">Alivia</td>
          </tr>
          <tr>
            <td style="padding:8px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5;color:#1f2933;">
              <h1 style="margin:0 0 16px;font-size:22px;font-weight:bold;color:#1f2933;">Hola, {{name}}</h1>
              <p style="margin:0;">Tu cuenta de Alivia ya está activa. Desde ahora puedes iniciar sesión con tu correo y tu contraseña.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px;border-top:1px solid #e4e7eb;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#52606d;">Recibes este correo porque se activó una cuenta de Alivia con esta dirección.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
