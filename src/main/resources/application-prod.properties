# Environment Name
environment.name=prod
spring.docker.compose.enabled=false

# Server Configuration
server.port=${PORT}

# Spring Application Name
spring.application.name=Alivia Web Services

# PostgreSQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=${DOCUMENTATION_APPLICATION_DESCRIPTION:Alivia Web Services API Documentation}
documentation.application.version=${DOCUMENTATION_APPLICATION_VERSION:1.0.0}

# IAM Email Verification
alivia.iam.email-verification.expiration-hours=${IAM_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
alivia.iam.email-verification.resend-cooldown-seconds=${IAM_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
alivia.iam.email-verification.link-base-url=${IAM_EMAIL_VERIFICATION_LINK_BASE_URL}
# Fail closed by default: set IAM_EMAIL_PROVIDER=smtp (plus MAIL_HOST, MAIL_PORT,
# MAIL_USERNAME and MAIL_PASSWORD) to deliver real verification emails.
alivia.iam.email-verification.provider=${IAM_EMAIL_PROVIDER:unavailable}
alivia.iam.email-verification.from=${IAM_EMAIL_FROM:no-reply@alivia.com}
alivia.iam.email-verification.subject=${IAM_EMAIL_SUBJECT:Verifica tu cuenta de Alivia}
# IAM session tokens. IAM_JWT_SECRET is required: at least 32 bytes.
alivia.iam.jwt.secret=${IAM_JWT_SECRET}
alivia.iam.jwt.access-token-expiration-minutes=${IAM_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
alivia.iam.jwt.refresh-token-expiration-days=${IAM_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}
# CORS_ALLOWED_ORIGINS is required: comma-separated origin patterns of the frontend.
alivia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}


# Cloudinary Configuration Properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
