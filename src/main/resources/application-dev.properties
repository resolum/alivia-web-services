# Environment Name
environment.name=dev

# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=Alivia Web Services

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alivia_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:alivia_db}
spring.data.mongodb.auto-index-creation=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Alivia Web Services API Documentation
documentation.application.version=1.0.0

# IAM Email Verification
alivia.iam.email-verification.expiration-hours=${IAM_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
# PENDING(confirm): frontend verification route.
alivia.iam.email-verification.link-base-url=${IAM_EMAIL_VERIFICATION_LINK_BASE_URL:http://localhost:5173/verify-email}
# Local development logs the verification link instead of sending email.
alivia.iam.email-verification.provider=${IAM_EMAIL_PROVIDER:log}
alivia.iam.email-verification.from=${IAM_EMAIL_FROM:no-reply@alivia.local}
alivia.iam.email-verification.subject=${IAM_EMAIL_SUBJECT:Verifica tu cuenta de Alivia}

# Stripe test keys are supplied by environment variables; never commit sk_test values.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Cloudinary Configuration Properties
cloudinary.cloud-name=CLOUDINARY_CLOUD_NAME
cloudinary.api-key=CLOUDINARY_API_KEY
cloudinary.api-secret=CLOUDINARY_API_SECRET
