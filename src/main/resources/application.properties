spring.application.name=alivia-web-services
spring.profiles.default=dev
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:postgresql://localhost:5432/alivia_services_example
spring.datasource.username=replace_with_your_postgres_user
spring.datasource.password=replace_with_your_postgres_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.resolum.alivia.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
