# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=Alivia Web Services

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/alivia_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=com.resolum.alivia.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Correlation id of the request (CorrelationIdFilter); "system" outside a request.
logging.pattern.level=%5p [%X{correlationId:-system}]

# Actuator: only health and info are exposed, and health details require authentication.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:alivia_db}
spring.data.mongodb.auto-index-creation=true

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
documentation.application.description=Alivia Web Services API Documentation
documentation.application.version=1.0.0

# IAM Email Verification
alivia.iam.email-verification.expiration-hours=${IAM_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
alivia.iam.email-verification.resend-cooldown-seconds=${IAM_EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

# Frontend verification route.
alivia.iam.email-verification.link-base-url=${IAM_EMAIL_VERIFICATION_LINK_BASE_URL:http://localhost:5173/verify-email}

# log (console), smtp (spring.mail.*), resend or unavailable (fail closed).
alivia.communications.email.provider=${IAM_EMAIL_PROVIDER:log}
alivia.communications.email.from=${IAM_EMAIL_FROM:no-reply@alivia.local}
alivia.communications.email.from-name=${IAM_EMAIL_FROM_NAME:Alivia}
# Resend API key (provider=resend). Secret: set it only as an environment variable.
alivia.communications.email.resend.api-key=${RESEND_API_KEY:}
# Invitation sent to new staff: the link opens the admin page where they create their password.
alivia.iam.account-activation.expiration-hours=${IAM_ACCOUNT_ACTIVATION_EXPIRATION_HOURS:48}
alivia.iam.account-activation.link-base-url=${IAM_ACCOUNT_ACTIVATION_LINK_BASE_URL:http://localhost:4200/activate-account}

# IAM session tokens. The default secret is for local use only; set IAM_JWT_SECRET (32+ bytes) elsewhere.
alivia.iam.jwt.secret=${IAM_JWT_SECRET}
alivia.iam.jwt.access-token-expiration-minutes=${IAM_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
alivia.iam.jwt.refresh-token-expiration-days=${IAM_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

# Comma-separated CORS origin patterns, e.g. https://app.alivia.com,https://*.alivia.com
alivia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}
# Preloaded administrator created on startup if missing. Override both in shared environments.
alivia.iam.super-admin.email=${IAM_SUPER_ADMIN_EMAIL:EMAIL}
alivia.iam.super-admin.password=${IAM_SUPER_ADMIN_PASSWORD:PASSWORD}

# Photo given to a new profile when the user signs up without one.
alivia.iam.profiles.default-photo-url=${IAM_DEFAULT_PHOTO_URL:https://res.cloudinary.com/dcppsmlzd/image/upload/v1793056387/depositphotos_133352156-stock-illustration-default-placeholder-profile-icon_q0py6r.webp}

# Stripe test keys are supplied by environment variables; never commit sk_test values.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Cloudinary Configuration Properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:CLOUDINARY_API_SECRET}

# Business used by HCM requests that do not name one (today Alivia is the only business).
alivia.hcm.default-business-id=${HCM_DEFAULT_BUSINESS_ID:1}
