# Test profile. Activate it with @ActiveProfiles("test") in integration tests.
# Unit tests do not need it: they never start the Spring context.
spring.docker.compose.enabled=false

# The logging sender never delivers email; it only writes the link to the log.
# "unavailable" cannot be used here because that sender is @Profile("prod").
alivia.communications.email.provider=log

# Dummy credentials: tests must not call Stripe or Cloudinary for real.
stripe.secret-key=sk_test_dummy
stripe.publishable-key=pk_test_dummy
stripe.webhook-secret=whsec_dummy
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

logging.level.root=WARN
