# Test profile. Activate it with @ActiveProfiles("test") in integration tests.
# Unit tests do not need it: they never start the Spring context.
spring.docker.compose.enabled=false

# In-memory H2 in PostgreSQL mode: the context starts without PostgreSQL.
# Slice tests that need their own database override these values with @TestPropertySource.
spring.datasource.url=jdbc:h2:mem:alivia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway is disabled here on purpose. The migrations are PostgreSQL DDL (identity columns,
# jsonb, typed check constraints) and H2 cannot execute them, so Hibernate builds the schema
# for the tests. The migrations themselves are verified against a real PostgreSQL; see
# docs/database-migrations.md.
spring.flyway.enabled=false

# Creating MongoDB indexes at startup would require a running server.
spring.data.mongodb.auto-index-creation=false

# The logging sender never delivers email; it only writes the link to the log.
# "unavailable" cannot be used here because that sender is @Profile("prod").
alivia.communications.email.provider=log

# Required by TokenServiceImpl: at least 32 bytes. Dummy value, never used outside tests.
alivia.iam.jwt.secret=test-only-alivia-jwt-secret-at-least-32-bytes
# Dummy preloaded administrator, so the seed does not depend on the environment.
alivia.iam.super-admin.email=super-admin@alivia.test
alivia.iam.super-admin.password=test-password
alivia.iam.profiles.default-photo-url=https://example.test/default-photo.webp

# Dummy credentials: tests must not call Stripe or Cloudinary for real.
stripe.secret-key=sk_test_dummy
stripe.publishable-key=pk_test_dummy
stripe.webhook-secret=whsec_dummy
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

logging.level.root=WARN
