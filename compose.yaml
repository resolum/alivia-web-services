services:
  mongodb:
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=alivia_db'
    ports:
      - '27017:27017'
    volumes:
      - 'mongo-data:/data/db'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=alivia_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      # Keeps the data in the mounted volume on every image version (18+ changed the default).
      - 'PGDATA=/var/lib/postgresql/data/pgdata'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d alivia_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
  postgres-data:
